[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivoirevoice"
version = "0.1.0"
description = "Squelette maintenable pour la transcription français–dioula."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "IvoireVoice AI contributors" },
]
dependencies = []

[project.optional-dependencies]
core = [
  "PyYAML>=6.0,<7",
]
data = [
  "soundfile>=0.12,<1",
]
ml = [
  "peft>=0.12,<1",
  "torch>=2.2,<3",
  "torchaudio>=2.2,<3",
  "transformers>=4.44,<5",
]
api = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]
ui = [
  "gradio>=5,<7",
]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=ivoirevoice --cov-report=term-missing --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ivoirevoice"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
ignore_missing_imports = true
pretty = true
show_error_codes = true
