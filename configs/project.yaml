project:
  name: IvoireVoice AI
  version: 0.1.0
  default_language: fr
  supported_languages:
    - fr
    - en
    - dyu
  default_model: dummy

api:
  max_upload_size_mb: 25
  audio_retention: delete_immediately
  allowed_content_types:
    - audio/flac
    - audio/mp3
    - audio/mpeg
    - audio/ogg
    - audio/wav
    - audio/wave
    - audio/x-flac
    - audio/x-wav
    - application/ogg
