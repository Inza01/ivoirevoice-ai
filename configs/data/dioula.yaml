dataset:
  language_code: dyu
  source_environment_variable: IVOIREVOICE_DIOULA_DATA_DIR
  audio_column: audio
  text_column: transcription
  speaker_column: speaker_id
  license_status: unknown
  usage_scope: local_research_only
  hash_audio: true
  split:
    strategy: speaker
    seed: 42
    train_ratio: 0.8
    validation_ratio: 0.1
    test_ratio: 0.1

artifacts:
  root_environment_variable: IVOIREVOICE_ARTIFACTS_DIR
  manifest_path: manifests/dioula_manifest_draft.csv
  report_directory: reports/data_audit

curation:
  source_manifest_path: manifests/dioula_manifest_draft.csv
  candidate_manifest_path: manifests/dioula_manifest_curated_candidate.csv
  metadata_path: manifests/dioula_dataset_candidate_metadata.json
  report_directory: reports/data_curation
  target_text: text_without_tones_nfc
  recover_missing_audio: false
  recovery_output_environment_variable: IVOIREVOICE_DIOULA_INTERIM_DIR
